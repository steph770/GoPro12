<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H12 Begleiter</title>
<meta name="description" content="Bedienhilfe, Szenen-Rezepte, Experimente und Checklisten für die GoPro HERO12 Black">
<meta name="theme-color" content="#0A4D68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/kamera" aria-label="Zur Startseite">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="7" width="28" height="20" rx="5" fill="currentColor"/><circle cx="21" cy="17" r="6" fill="var(--bg)"/><circle cx="21" cy="17" r="3.2" fill="currentColor"/><rect x="6" y="4" width="7" height="4" rx="1.5" fill="currentColor"/></svg>
    <span>H12 Begleiter</span>
  </a>
  <button class="theme" id="themeBtn" aria-label="Hell oder dunkel umschalten">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Bereiche">
  <a href="#/kamera" data-tab="kamera"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="12.5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 6V4.5h4V6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Kamera</span></a>
  <a href="#/szenen" data-tab="szenen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 18l6-8 4 5 3-3 7 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="17" cy="6.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Szenen</span></a>
  <a href="#/ideen" data-tab="ideen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.4 6.1 6.1 2.4-6.1 2.4L12 19.5l-2.4-6.1L3.5 11l6.1-2.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M19 17v4M17 19h4" stroke="currentColor" stroke-width="1.8"/></svg><span>Ideen</span></a>
  <a href="#/checks" data-tab="checks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 9l2 2 4-4M8 16h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Checks</span></a>
</nav>

<div class="sheet-back" id="sheetBack" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
